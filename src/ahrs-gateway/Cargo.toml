# Project package info section.
[package]
name         = "ahrs-gateway"
version      = "0.1.0"
description  = "Mediator between IMU and AHRS"
authors      = ["Alexander <alkuzindev@gmail.com>"]
repository   = "https://github.com/alkuzin/ahrs-debug-rig"
license      = "Apache-2.0"
edition      = "2024"
rust-version = "1.88"

# Project package info section.
[dependencies]
# Bare-metal (no_std) HAL for all Espressif ESP32 devices.
esp-hal = { version = "1.0.0", features = ["log-04", "esp32", "unstable"] }
# An RTOS (Real-Time Operating System) implementation for esp-hal.
esp-rtos = { version = "0.2.0", features = [
  "log-04",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }
# A library that provides print!, println!, dbg! implementations and logging
# capabilities for Espressif devices.
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
# Bootloader Support Library supplementing esp-hal.
esp-bootloader-esp-idf = { version = "0.4.0", features = ["log-04", "esp32"] }
# Async network stack, designed for embedded systems.
embassy-net = { version = "0.7.1", features = [
  "log",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
# A Hardware Abstraction Layer (HAL) for embedded systems.
embedded-hal = "1.0.0"
# Input/Output traits for embedded systems.
embedded-io = "0.7.1"
# Async IO traits for embedded systems.
embedded-io-async = "0.7.0"
# A no_std heap allocator for RISC-V and Xtensa processors from Espressif.
esp-alloc = "0.9.0"
# An async/await executor designed for embedded usage.
embassy-executor = { version = "0.9.1", features = ["log"] }
# Timekeeping, delays and timeouts.
embassy-time = { version = "0.5.0", features = ["log"] }
# Synchronization primitives and data structures with async support.
embassy-sync = { version = "0.7.2", features = ["log"] }
# Wireless support for Espressif ESP32 devices.
esp-radio = { version = "0.17.0", features = [
  "log-04",
  "esp-alloc",
  "esp32",
  "smoltcp",
  "unstable",
  "wifi",
] }
# The lightweight, modular, and asynchronous TCP/IP stack designed for
# embedded systems and IoT applications.
smoltcp = { version = "0.12.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
# Basic primitive to control concurrency.
critical-section = "1.2.0"
# Statically allocated, initialized at runtime cell.
static_cell = "2.1.1"
# The lightweight, binary application-layer (L7) protocol designed specifically
# for the Inertial Navigation Systems (INS) and autonomous platforms.
indtp = { git = "https://github.com/alkuzin/indtp", default-features = true }

# This profile is used during the development phase of project.
[profile.dev]
# Compiler will apply optimizations focused on reducing the size of the binary.
opt-level = "s"

# This profile is used when preparing the application for production.
[profile.release]
# Reduces the number of code generation units, allowing LLVM to optimize
# across the entire codebase using a single thread.
codegen-units = 1
# Generating enough debug information to facilitate debugging with tools.
debug = 2
# Disables assertions in the release build.
debug-assertions = false
# Disables incremental compilation in release builds.
incremental = false
# Enables Link Time Optimisation (LTO) - compiler will optimize the entire
# program during the linking phase.
lto = 'fat'
# Compiler will apply optimizations focused on reducing the size of the binary.
opt-level = 's'
# Disables checks for integer overflow in release builds.
overflow-checks = false
